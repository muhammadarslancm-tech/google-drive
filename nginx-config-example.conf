# Nginx Configuration Example for Google Drive Manager
# Add this to your nginx site configuration
# Adjust PHP-FPM socket path and PHP version as needed

server {
    listen 80;
    server_name your-domain.com;
    root /var/www/google-drive;
    index index.php index.html;

    # API Routes - All /api/* requests go to backend
    location /api/ {
        # Don't try files, directly route to backend
        try_files $uri /backend/public/index.php?$query_string;
        
        # FastCGI configuration
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock; # Adjust PHP version
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/backend/public/index.php;
        include fastcgi_params;
        
        # Preserve original request URI for routing
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
    }

    # Backend directory - deny direct access
    location /backend/ {
        deny all;
        return 404;
    }
    
    # Exception: Allow backend/public/index.php for API
    location = /backend/public/index.php {
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Frontend static files (CSS, JS, images)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend HTML files and routes
    location / {
        try_files $uri $uri/ /frontend/$uri /index.php?$query_string;
    }

    # Root PHP files (login.php, register.php, index.php)
    location ~ ^/(login|register|index|forgot-password|reset-password)\.php$ {
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Frontend PHP files
    location ~ ^/frontend/.*\.php$ {
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to hidden files and sensitive directories
    location ~ /\. {
        deny all;
    }
    
    location ~ /(storage|config|bootstrap\.php|routes) {
        deny all;
    }
}
