<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Dashboard - Google Drive Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/MaterialDesign-Webfont/5.3.45/css/materialdesignicons.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style type="text/css">
        body {
            margin: 0;
            background-color: #f1f3f7;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 250px;
            background: #fff;
            border-right: 1px solid #eff0f2;
            padding: 1.5rem 0;
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 0 1.5rem 1.5rem;
            border-bottom: 1px solid #eff0f2;
            margin-bottom: 1rem;
        }

        .sidebar-header h4 {
            margin: 0;
            color: #3b76e1;
            font-weight: 600;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu li {
            margin: 0.25rem 0;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            padding: 0.75rem 1.5rem;
            color: #666;
            text-decoration: none;
            transition: all 0.2s;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: #f8f9fa;
            color: #3b76e1;
        }

        .sidebar-menu a i {
            margin-right: 0.75rem;
            width: 20px;
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
        }

        .top-bar {
            background: #fff;
            padding: 1rem 2rem;
            border-bottom: 1px solid #eff0f2;
            margin: -2rem -2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            position: relative;
            max-width: 400px;
            flex: 1;
            margin-right: 1rem;
        }

        .search-box input {
            border-radius: 10px;
            padding-left: 40px;
            border: 1px solid #e0e0e0;
        }

        .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #545965;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .card {
            margin-bottom: 24px;
            box-shadow: 0 2px 3px #e4e8f0;
            border: 1px solid #eff0f2;
            border-radius: 1rem;
        }

        .card-body {
            padding: 1.5rem;
        }

        .file-item, .folder-item {
            padding: 0.75rem;
            border: 1px solid #eff0f2;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-item:hover, .folder-item:hover {
            background: #f8f9fa;
            border-color: #3b76e1;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .btn-primary {
            background: #3b76e1;
            border: none;
        }

        .btn-primary:hover {
            background: #2d5aa8;
        }

        .storage-bar {
            height: 8px;
            border-radius: 4px;
            background: #e0e0e0;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .storage-bar-fill {
            height: 100%;
            background: #3b76e1;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h4><i class="mdi mdi-google-drive"></i> Drive Manager</h4>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#" class="active" data-view="files"><i class="mdi mdi-file-outline"></i> My Files</a></li>
            <li><a href="#" data-view="folders"><i class="mdi mdi-folder-outline"></i> Folders</a></li>
            <li><a href="#" data-view="shared"><i class="mdi mdi-share-variant"></i> Shared with me</a></li>
            <li><a href="#" data-view="trash"><i class="mdi mdi-delete-outline"></i> Trash</a></li>
            <li><a href="#" data-view="storage"><i class="mdi mdi-harddisk"></i> Storage</a></li>
            <li><a href="#" id="logoutBtn"><i class="mdi mdi-logout"></i> Logout</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="top-bar">
            <div class="search-box">
                <i class="mdi mdi-magnify search-icon"></i>
                <input type="text" class="form-control" id="searchInput" placeholder="Search files and folders...">
            </div>
            <div class="user-menu">
                <button class="btn btn-primary" id="createFolderBtn">
                    <i class="mdi mdi-folder-plus me-1"></i> New Folder
                </button>
                <button class="btn btn-primary" id="uploadFileBtn">
                    <i class="mdi mdi-upload me-1"></i> Upload
                </button>
                <div class="dropdown">
                    <button class="btn btn-link text-muted d-flex align-items-center" type="button" data-bs-toggle="dropdown">
                        <i class="mdi mdi-account-circle me-2" style="font-size: 24px;"></i>
                        <span id="userNameDisplay" class="d-none d-md-inline"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><h6 class="dropdown-header" id="userEmailDisplay"></h6></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" id="logoutBtn2">Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Files View -->
        <div id="filesView" class="view">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">My Files</h5>
                <div id="currentFolderPath" class="text-muted"></div>
            </div>
            <div id="filesList" class="loading">Loading files...</div>
        </div>

        <!-- Folders View -->
        <div id="foldersView" class="view" style="display: none;">
            <h5 class="mb-3">Folders</h5>
            <div id="foldersList" class="loading">Loading folders...</div>
        </div>

        <!-- Shared View -->
        <div id="sharedView" class="view" style="display: none;">
            <h5 class="mb-3">Shared with me</h5>
            <div id="sharedList" class="loading">Loading shared files...</div>
        </div>

        <!-- Trash View -->
        <div id="trashView" class="view" style="display: none;">
            <h5 class="mb-3">Trash</h5>
            <div id="trashList" class="loading">Loading trash...</div>
        </div>

        <!-- Storage View -->
        <div id="storageView" class="view" style="display: none;">
            <h5 class="mb-3">Storage</h5>
            <div class="card">
                <div class="card-body">
                    <div id="storageStats">
                        <div class="loading">Loading storage stats...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- File Upload Input (hidden) -->
    <input type="file" id="fileInput" multiple style="display: none;">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
